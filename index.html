<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora GA Entregas Express</title>
    <meta name="description" content="Calculadora de preços para entregas de moto - GA Entregas Express. Calcule distância e valor automaticamente.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #08090d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient glow effects */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            max-width: 520px;
            width: 100%;
            background: linear-gradient(145deg, rgba(18, 19, 24, 0.95), rgba(14, 15, 20, 0.98));
            padding: 32px;
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(212, 175, 55, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        /* Header section */
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
        }

        .logo-icon {
            font-size: 2.2em;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.3));
        }

        h1 {
            font-size: 1.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #d4af37, #f5d76e, #d4af37);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        .subtitle {
            color: #777;
            font-size: 0.82em;
            margin-top: 4px;
            font-weight: 400;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            font-weight: 600;
            font-size: 0.82em;
            display: block;
            margin-bottom: 6px;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 0.92em;
            transition: all 0.25s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: rgba(212, 175, 55, 0.5);
            background: rgba(212, 175, 55, 0.04);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08);
        }

        input::placeholder {
            color: #555;
        }

        select option {
            background: #1a1c23;
            color: #fff;
        }

        /* Checkbox section */
        .checkbox-section {
            margin: 20px 0;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .checkbox-section .section-title {
            font-size: 0.78em;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            cursor: pointer;
            transition: color 0.2s;
        }

        .checkbox-item:hover {
            color: #fff;
        }

        .checkbox-item + .checkbox-item {
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .checkbox-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .checkbox-item input[type="checkbox"]:checked {
            background: #d4af37;
            border-color: #d4af37;
        }

        .checkbox-item input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-size: 13px;
            font-weight: 700;
        }

        .checkbox-label {
            font-size: 0.88em;
            font-weight: 500;
        }

        .checkbox-detail {
            font-size: 0.75em;
            color: #666;
            font-weight: 400;
        }

        /* Two column row */
        .row-two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* Button */
        .btn-calcular {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: linear-gradient(135deg, #d4af37, #c5a028);
            border: none;
            font-size: 0.95em;
            font-weight: 700;
            color: #0a0a0a;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-calcular::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-calcular:hover {
            background: linear-gradient(135deg, #e0be4a, #d4af37);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
        }

        .btn-calcular:hover::before {
            left: 100%;
        }

        .btn-calcular:active {
            transform: translateY(0);
        }

        .btn-calcular:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-calcular:disabled:hover::before {
            left: -100%;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(0,0,0,0.2);
            border-top-color: #0a0a0a;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Result panel */
        .result {
            margin-top: 24px;
            padding: 20px;
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.06), rgba(212, 175, 55, 0.02));
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            text-align: center;
            animation: fadeSlideIn 0.4s ease-out;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-distance {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82em;
            color: #999;
            background: rgba(255, 255, 255, 0.04);
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .result-label {
            font-size: 0.85em;
            color: #aaa;
            font-weight: 500;
        }

        .result-total {
            font-size: 2.2em;
            font-weight: 800;
            background: linear-gradient(135deg, #d4af37, #f5d76e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 6px 0 16px 0;
            line-height: 1.2;
        }

        /* Breakdown */
        .breakdown {
            text-align: left;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .breakdown-title {
            font-size: 0.72em;
            font-weight: 600;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 0.84em;
        }

        .breakdown-row .label {
            color: #999;
            font-weight: 400;
        }

        .breakdown-row .value {
            color: #ccc;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .breakdown-row.total-row {
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            margin-top: 8px;
            padding-top: 10px;
        }

        .breakdown-row.total-row .label {
            color: #d4af37;
            font-weight: 700;
        }

        .breakdown-row.total-row .value {
            color: #d4af37;
            font-weight: 800;
            font-size: 1.05em;
        }

        /* Error message */
        .error-msg {
            margin-top: 20px;
            padding: 14px 16px;
            background: rgba(220, 53, 69, 0.08);
            border: 1px solid rgba(220, 53, 69, 0.25);
            border-radius: 10px;
            color: #ff6b7a;
            font-size: 0.85em;
            text-align: center;
            animation: fadeSlideIn 0.3s ease-out;
        }

        .error-msg strong {
            display: block;
            margin-bottom: 4px;
            color: #ff8a97;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.72em;
            color: #444;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 22px 18px;
            }

            h1 {
                font-size: 1.25em;
            }

            .row-two {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .result-total {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="logo-icon">🏍️</span>
            <h1>GA ENTREGAS EXPRESS</h1>
            <p class="subtitle">Calculadora Automática de Entregas</p>
        </div>

        <div class="form-group">
            <label for="origem">📍 Endereço de Coleta (Origem)</label>
            <input type="text" id="origem" placeholder="Ex: Av. T-63, Bueno, Goiânia - GO">
        </div>

        <div class="form-group">
            <label for="destino">📍 Endereço de Entrega (Destino)</label>
            <input type="text" id="destino" placeholder="Ex: Praça Tamandaré, Goiânia - GO">
        </div>

        <div class="form-group">
            <label for="servico">🔧 Tipo de Serviço</label>
            <select id="servico">
                <option value="agendada">Agendada (Rota Comercial)</option>
                <option value="avulsa">Avulsa / Emergência</option>
                <option value="intermunicipal">Intermunicipal (&gt; 40km)</option>
            </select>
        </div>

        <div class="checkbox-section">
            <div class="section-title">Adicionais</div>
            <label class="checkbox-item">
                <input type="checkbox" id="retorno">
                <div>
                    <div class="checkbox-label">Retorno / Bate e Volta</div>
                    <div class="checkbox-detail">+60% sobre o valor base</div>
                </div>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="condominio">
                <div>
                    <div class="checkbox-label">Condomínio Horizontal</div>
                    <div class="checkbox-detail">+R$ 5,00</div>
                </div>
            </label>
        </div>

        <div class="row-two">
            <div class="form-group">
                <label for="valorNf">💰 Valor NF (R$)</label>
                <input type="number" id="valorNf" step="0.01" placeholder="Ex: 600,00">
            </div>
            <div class="form-group">
                <label for="tempoEspera">⏱️ Espera Extra (min)</label>
                <input type="number" id="tempoEspera" placeholder="Além de 10 min">
            </div>
        </div>

        <button class="btn-calcular" id="btnCalcular" onclick="calcularCorrida()">
            CALCULAR DISTÂNCIA E VALOR
        </button>

        <div id="painelResultado" style="display:none;"></div>
        <div id="painelErro" style="display:none;"></div>

        <div class="footer">
            Valores estimados • Distância calculada via rota real
        </div>
    </div>

    <script>
        /**
         * Busca coordenadas (latitude/longitude) de um endereço via Nominatim (OpenStreetMap).
         * Respeita a política de uso: máx 1 request/segundo.
         */
        async function buscarCoordenadas(endereco) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}&limit=1&countrycodes=br`;
            const resp = await fetch(url);

            if (!resp.ok) {
                throw new Error(`Erro na API de geocodificação (HTTP ${resp.status})`);
            }

            const data = await resp.json();

            if (!data || data.length === 0) {
                throw new Error(`Endereço não encontrado: "${endereco}". Tente incluir bairro e cidade (ex: Rua X, Bairro, Goiânia - GO).`);
            }

            return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        }

        /**
         * Aguarda um número de milissegundos (para rate limiting).
         */
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        /**
         * Formata valor em reais.
         */
        function formatarReais(valor) {
            return 'R$ ' + valor.toFixed(2).replace('.', ',');
        }

        /**
         * Retorna o nome legível do tipo de serviço.
         */
        function nomeServico(servico) {
            const nomes = {
                'agendada': 'Agendada',
                'avulsa': 'Avulsa / Emergência',
                'intermunicipal': 'Intermunicipal'
            };
            return nomes[servico] || servico;
        }

        /**
         * Calcula a corrida: geocodifica endereços, busca rota, aplica regras de preço.
         */
        async function calcularCorrida() {
            const btn = document.getElementById('btnCalcular');
            const painelResultado = document.getElementById('painelResultado');
            const painelErro = document.getElementById('painelErro');

            // Limpa resultados anteriores
            painelResultado.style.display = 'none';
            painelErro.style.display = 'none';

            const origemTxt = document.getElementById('origem').value.trim();
            const destinoTxt = document.getElementById('destino').value.trim();

            if (!origemTxt || !destinoTxt) {
                mostrarErro('Preencha ambos os endereços para calcular.');
                return;
            }

            // Estado de loading
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> CALCULANDO...';

            try {
                // 1. Geocodifica o endereço de ORIGEM
                const p1 = await buscarCoordenadas(origemTxt);

                // Aguarda 1.1s para respeitar rate limit do Nominatim (1 req/seg)
                await delay(1100);

                // 2. Geocodifica o endereço de DESTINO
                const p2 = await buscarCoordenadas(destinoTxt);

                // 3. Calcula rota e distância real via OSRM
                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${p1.lon},${p1.lat};${p2.lon},${p2.lat}?overview=false`;
                const routeResp = await fetch(osrmUrl);

                if (!routeResp.ok) {
                    throw new Error(`Erro na API de roteamento (HTTP ${routeResp.status})`);
                }

                const routeData = await routeResp.json();

                if (!routeData.routes || routeData.routes.length === 0) {
                    throw new Error('Não foi possível calcular uma rota entre esses endereços.');
                }

                const metros = routeData.routes[0].distance;
                const km = metros / 1000;
                const duracaoMin = Math.round(routeData.routes[0].duration / 60);

                // 4. Coleta parâmetros do formulário
                const servico = document.getElementById('servico').value;
                const retorno = document.getElementById('retorno').checked;
                const condominio = document.getElementById('condominio').checked;
                const valorNf = parseFloat(document.getElementById('valorNf').value) || 0;
                const tempoEspera = parseInt(document.getElementById('tempoEspera').value) || 0;

                // 5. Calcula valor base conforme tipo de serviço
                let valorBase = 0;

                if (servico === 'agendada') {
                    if (km <= 5) valorBase = 20.00;
                    else if (km <= 10) valorBase = 25.00;
                    else if (km <= 15) valorBase = 35.00;
                    else if (km <= 20) valorBase = 50.00;
                    else valorBase = km * 3.00;
                } else if (servico === 'avulsa') {
                    valorBase = (km * 3.50) + 7.00;
                } else if (servico === 'intermunicipal') {
                    valorBase = km * 4.00;
                }

                // 6. Calcula adicionais
                const adicRetorno = retorno ? (valorBase * 0.60) : 0;
                const adicCondo = condominio ? 5.00 : 0;
                const taxaRisco = (valorNf > 500) ? (valorNf * 0.05) : 0;
                const taxaEspera = tempoEspera > 0 ? (tempoEspera * 0.70) : 0;

                // 7. Total
                const total = valorBase + adicRetorno + adicCondo + taxaRisco + taxaEspera;

                // 8. Monta breakdown
                let breakdownHTML = '';

                breakdownHTML += montarLinhaBreakdown('Valor base (' + nomeServico(servico) + ')', valorBase);

                if (adicRetorno > 0)
                    breakdownHTML += montarLinhaBreakdown('Retorno / Bate e volta (+60%)', adicRetorno);

                if (adicCondo > 0)
                    breakdownHTML += montarLinhaBreakdown('Condomínio horizontal', adicCondo);

                if (taxaRisco > 0)
                    breakdownHTML += montarLinhaBreakdown('Taxa de risco (NF > R$500)', taxaRisco);

                if (taxaEspera > 0)
                    breakdownHTML += montarLinhaBreakdown('Espera excedente (' + tempoEspera + ' min × R$0,70)', taxaEspera);

                // 9. Renderiza resultado
                painelResultado.innerHTML = `
                    <div class="result">
                        <div class="result-distance">
                            📏 ${km.toFixed(1)} km &nbsp;•&nbsp; ≈ ${duracaoMin} min
                        </div>
                        <div class="result-label">Valor Total Previsto</div>
                        <div class="result-total">${formatarReais(total)}</div>
                        <div class="breakdown">
                            <div class="breakdown-title">Detalhamento</div>
                            ${breakdownHTML}
                            <div class="breakdown-row total-row">
                                <span class="label">Total</span>
                                <span class="value">${formatarReais(total)}</span>
                            </div>
                        </div>
                    </div>
                `;
                painelResultado.style.display = 'block';

                // Scroll suave até o resultado
                painelResultado.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (err) {
                console.error('Erro no cálculo:', err);
                mostrarErro(err.message || 'Erro ao buscar rota. Tente detalhar melhor os endereços (inclua bairro e cidade).');
            } finally {
                // Restaura botão
                btn.disabled = false;
                btn.innerHTML = 'CALCULAR DISTÂNCIA E VALOR';
            }
        }

        /**
         * Monta uma linha de breakdown HTML.
         */
        function montarLinhaBreakdown(label, valor) {
            return `
                <div class="breakdown-row">
                    <span class="label">${label}</span>
                    <span class="value">${formatarReais(valor)}</span>
                </div>
            `;
        }

        /**
         * Exibe mensagem de erro estilizada.
         */
        function mostrarErro(mensagem) {
            const painelErro = document.getElementById('painelErro');
            painelErro.innerHTML = `
                <div class="error-msg">
                    <strong>⚠️ Não foi possível calcular</strong>
                    ${mensagem}
                </div>
            `;
            painelErro.style.display = 'block';
        }

        // Permite calcular pressionando Enter nos campos de endereço
        document.getElementById('origem').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('destino').focus();
        });
        document.getElementById('destino').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') calcularCorrida();
        });
    </script>
</body>
</html>
